name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Makefile'
      - 'LICENSE'
      - '.env.example'
      - '.gitignore'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          (cd auth && npm ci)
          (cd queue && npm ci)

      - name: Run tests
        run: node --test --test-force-exit tests/**/*.test.mjs

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # 프론트 빌드는 이미지 빌드에서만 실패를 알 수 있어 늦다. PR 단계에서 미리 깨뜨린다.
      - name: Build auth SPA
        run: cd auth/web && npm ci && npm run build

      - name: Build queue SPA
        run: cd queue/web && npm ci && npm run build

      - name: Build landing
        run: cd landing && npm ci && npm run build
